# PR0: correctness and basic formatting, without unrelated style rewrites.
included:
  - ConfLingo
  - ConfLingoTests

only_rules:
  - force_cast
  - force_try
  - duplicate_imports
  - unused_optional_binding
  - trailing_whitespace
  - trailing_newline
  - vertical_whitespace
  - return_arrow_whitespace
  - opening_brace
  - closing_brace
  - comma
  - colon

check_for_updates: false
