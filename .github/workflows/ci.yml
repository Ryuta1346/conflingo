name: macOS validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare tools and output paths
        run: |
          printf 'CONFLINGO_CI_OUTPUT_DIR=%s/conflingo-ci\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SWIFTLINT_BIN=%s/conflingo-tools/swiftlint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          bash scripts/install-swiftlint.sh "$RUNNER_TEMP/conflingo-tools"
      - name: Lint
        run: bash scripts/ci.sh lint
      - name: Test without live APIs
        run: bash scripts/ci.sh test
      - name: Build universal Release
        run: bash scripts/ci.sh release
      - name: Save validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/conflingo-ci/*.log
            ${{ runner.temp }}/conflingo-ci/tests.xcresult
          retention-days: 7
          if-no-files-found: warn
